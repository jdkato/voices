name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Uploading the archive to a release needs a token that can write
    # contents; this repository's default GITHUB_TOKEN is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The archive is what users install, so the license and the attribution
      # for the rules derived from no-ai-slop travel inside it.
      - run: cp LICENSE NOTICE Voices/
      - run: zip -r Voices.zip Voices -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Voices.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vale
        env:
          VALE_VERSION: 3.22.0
        run: |
          curl -sL --fail -o vale.tar.gz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf vale.tar.gz -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          repository: vale-cli/Std
          path: std-src

      # Fixtures, guards, coverage, and the repository's own self-lint, all
      # against a StylesPath assembled with Std present but not enabled --
      # the shape sync leaves for a user.
      - run: ./test.sh
        env:
          STD: ${{ github.workspace }}/std-src/Std

      # The briefs are prose, so nothing regenerates them. Each sits beside
      # its rules as Brief.md and ships in the archive. This walks the rules
      # and fails on anything a brief leaves unsaid, and the tests fail if
      # that walk ever stops being able to fail.
      - uses: actions/setup-go@v5
        with:
          go-version-file: script/brief/go.mod
      - run: go test ./...
        working-directory: script/brief
      - run: go run . -styles ../../Voices/styles
        working-directory: script/brief
