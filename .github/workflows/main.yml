name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The archive is what users install, so the license and the attribution
      # for the rules derived from no-ai-slop travel inside it.
      - run: cp LICENSE NOTICE Voices/
      - run: zip -r Voices.zip Voices -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Voices.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A rule that matches nothing loads cleanly, so the fixtures are the only
      # thing standing between a typo and a silently dead voice.
      # Unpacked outside the checkout. `vale .` below lints the working tree,
      # and the archive carries a README of its own.
      - name: Install Vale
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/vale-cli/vale/releases/download/v${VALE}/vale_${VALE}_Linux_64-bit.tar.gz
          mkdir -p vale && tar -xzf vale_${VALE}_Linux_64-bit.tar.gz -C vale
          echo "$RUNNER_TEMP/vale" >> $GITHUB_PATH
        env:
          VALE: 3.19.0

      - run: ./test.sh

      # The package on its own prose. A voice that cannot pass itself is a poor
      # advertisement, and .vale.ini here is the config the README hands out.
      - run: vale .

      # The briefs are prose, so nothing regenerates them. This walks the rules
      # and fails on anything a brief leaves unsaid, and the tests fail if that
      # walk ever stops being able to fail.
      - uses: actions/setup-go@v5
        with:
          go-version-file: script/brief/go.mod
      - run: go test ./...
        working-directory: script/brief
      - run: go run . -styles ../../Voices/styles -briefs ../../briefs
        working-directory: script/brief
