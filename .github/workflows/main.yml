name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The archive is what users install, so the license and the attribution
      # for the rules derived from no-ai-slop travel inside it.
      - run: cp LICENSE NOTICE Voices/
      - run: zip -r Voices.zip Voices -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Voices.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The length rules extend Std.SentenceLength, which needs the rule
      # inheritance on Vale's v3 branch -- built from source, outside the
      # checkout, until the next release ships it and the tarball returns.
      - uses: actions/checkout@v4
        with:
          repository: vale-cli/vale
          ref: v3
          path: vale-src
      - uses: actions/checkout@v4
        with:
          repository: vale-cli/Std
          path: std-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: vale-src/go.mod
      - run: |
          go build -o "$RUNNER_TEMP/bin/vale" ./cmd/vale
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH
        working-directory: vale-src

      # Fixtures, guards, coverage, and the repository's own self-lint, all
      # against a StylesPath assembled with Std present but not enabled --
      # the shape sync leaves for a user.
      - run: ./test.sh
        env:
          STD: ${{ github.workspace }}/std-src/Std

      # The briefs are prose, so nothing regenerates them. This walks the rules
      # and fails on anything a brief leaves unsaid, and the tests fail if that
      # walk ever stops being able to fail.
      - uses: actions/setup-go@v5
        with:
          go-version-file: script/brief/go.mod
      - run: go test ./...
        working-directory: script/brief
      - run: go run . -styles ../../Voices/styles -briefs ../../briefs
        working-directory: script/brief
