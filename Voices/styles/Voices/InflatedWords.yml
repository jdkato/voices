#
# The half of the inflated vocabulary that has one right answer. A
# `substitution` rule carries `action: replace` and the exact span, so an agent
# applies these without spending a turn deciding anything, and the alert costs
# nothing to act on.
#
# `Banned` keeps the rest. "Delve", "harness" and "paradigm shift" need a
# rewrite rather than a swap, and a fix applied without thought has to be right
# every time or it is worse than no fix at all.
extends: substitution
message: "Inflated word: use '%s' instead of '%s'."
level: error
ignorecase: true
action:
  name: replace
swap:
  utilize: use
  leverage: use
  facilitate: help
  streamline: simplify
  robust: strong
  meticulous: careful
  intricate: complex
  elevate: raise
  supercharge: speed up
