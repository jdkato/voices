# "Two per paragraph." Same token, wider scope -- the pair is what keeps the
# voice from collapsing into noise.
extends: occurrence
message: "%d slang terms in one paragraph. Budget is two."
level: error
scope: paragraph
max: 2
token: '\b(?:W|L|cooked|rizz|mid|no cap|fr fr|based(?!\s+(?:on|upon|in))|aura|delulu|skibidi|bussin|goated|lowkey|highkey|glazing|cap)\b'
