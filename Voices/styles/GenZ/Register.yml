extends: existence
message: "Corporate register: '%s'. Not this voice."
level: error
ignorecase: true
tokens:
  - furthermore
  - moreover
  - thus
  - hence
  - it is imperative
  - please be advised
  - as per
  - kindly note

tests:
  - name: fires
    input: |
      Furthermore, it works.
    want: |
      1:1:GenZ.Register:Corporate register: 'Furthermore'. Not this voice.
  - name: clean
    input: |
      Also, it works.
    want: ""
