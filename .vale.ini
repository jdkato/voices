# The package checks its own prose. A voice that cannot pass itself is a poor
# advertisement, and this is the same config the README tells you to write.
StylesPath = Voices/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Voices, Direct

# Fixtures are deliberately bad, briefs are generated rule listings, and
# script/tokens holds a cached copy of someone else's prompt. None of it is
# prose this project wrote.
[{briefs,fixtures,testdata,script}/**]
BasedOnStyles =
