# The package checks its own prose. A voice that cannot pass itself is a poor
# advertisement, and this is the same config the README tells you to write.
StylesPath = Voices/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Voices, Direct

# Fixtures are deliberately bad, a brief has to quote the words it forbids, and
# script/tokens holds a cached copy of someone else's prompt. None of it is
# prose these rules should judge. Neither are the CI checkouts: the workflow
# puts Vale and Std at vale-src/ and std-src/ inside this workspace, and their
# prose was never written in this voice.
[{briefs,fixtures,testdata,script,vale-src,std-src}/**]
BasedOnStyles =
